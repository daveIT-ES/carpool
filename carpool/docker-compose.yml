name: carpool

# Red: solo la aplicacion publica un puerto (8080). PostgreSQL y OSRM viven
# en la red interna de Docker y no son accesibles desde fuera.
#
# El 8080 escucha en todas las interfaces para que puedas apuntar hacia el
# el tunel de Cloudflare que ya tengas en otra maquina:
#     public hostname  ->  http://IP_DE_ESTA_MAQUINA:8080
#
# Si prefieres no exponer nada en la LAN, levanta el tunel desde este mismo
# compose (pon TUNNEL_TOKEN en .env), apunta el hostname a http://app:8000 y
# cambia la linea de ports por:   - "127.0.0.1:8080:8000"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/${OSM_BASE}.osrm
    volumes:
      - ./osrm-data:/data:ro
    expose:
      - "5000"

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
      osrm:
        condition: service_started

  # Opcional: solo si NO tienes ya un tunel de Cloudflare en otra maquina.
  #   docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  db-data:
