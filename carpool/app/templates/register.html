{% extends "base.html" %}
{% block title %}Crear cuenta · {{ app_name }}{% endblock %}
{% block content %}
<h1>Crear cuenta</h1>
<p class="lead">Necesitas el código de invitación que te da el conductor.</p>

<div class="card">
  <form method="post" action="/registro">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label for="codigo">Código de invitación</label>
    <input id="codigo" name="codigo" type="text" value="{{ codigo }}" required style="text-transform:uppercase">
    <label for="alias">Alias</label>
    <input id="alias" name="alias" type="text" minlength="3" required>
    <p class="hint">Con un nombre corto basta. No hace falta tu nombre completo.</p>
    <label for="email">Correo</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
    <button class="wide-btn" type="submit">Crear cuenta</button>
  </form>
</div>

<p class="hint">¿Ya tienes cuenta? <a href="/login">Entra aquí</a>.</p>
{% endblock %}
