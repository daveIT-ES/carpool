{% extends "base.html" %}
{% block title %}Entrar · {{ app_name }}{% endblock %}
{% block content %}
<h1>Entrar</h1>
<p class="lead">Identifícate para ver tus viajes y lo que debes.</p>

<div class="card">
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label for="identificador">Alias o correo</label>
    <input id="identificador" name="identificador" type="text" autocomplete="username" required autofocus>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="wide-btn" type="submit">Entrar</button>
  </form>
</div>

<p class="hint">¿Primera vez? Pide un código de invitación al conductor y <a href="/registro">crea tu cuenta</a>.</p>
{% endblock %}
